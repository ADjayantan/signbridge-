<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignBridge — Project Exhibition Poster | V.S.B. Engineering College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px 60px;
      min-height: 100vh;
    }

    /* Print Controls Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .ctrl-btn.download {
      background: #10b981;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .ctrl-btn.download:hover {
      background: #059669;
    }
    .ctrl-btn.secondary {
      background: #334155;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }
    .ctrl-btn.secondary:hover {
      background: #475569;
    }

    /* Poster Wrapper */
    .poster-viewport {
      max-width: 1280px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .poster-img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media print {
      body {
        background: transparent;
        padding: 0;
        margin: 0;
      }
      .controls-bar {
        display: none !important;
      }
      .poster-viewport {
        max-width: 100vw;
        border-radius: 0;
        box-shadow: none;
        border: none;
      }
      @page {
        size: landscape;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <button class="ctrl-btn" onclick="window.print()">🖨️ Print Poster / Save as PDF (A4/A3)</button>
    <a href="/poster-assets/signbridge-final-poster.png" download="V.S.B_SignBridge_Project_Poster.png" class="ctrl-btn download">💾 Download High-Res PNG (2048x1536)</a>
    <a href="http://127.0.0.1:5174/#trained-sign" target="_blank" class="ctrl-btn secondary">🌐 Open SignBridge Live App</a>
  </div>

  <!-- High-Res Master Poster Display -->
  <div class="poster-viewport">
    <img src="/poster-assets/signbridge-final-poster.png" alt="V.S.B. Engineering College - AI Enabled Bidirectional Sign Language Translation System Poster" class="poster-img">
  </div>

</body>
</html>
